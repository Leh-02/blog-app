<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body th:replace="admin/admin_layout :: layout(~{::content})">

<div th:fragment="content">

  <h2>Posts</h2>

  <a class="btn btn-success" th:href="@{/admin/posts/new}">Create Post</a>

  <div class="mt-3">
    <div th:each="p : ${posts}" class="admin-item p-3 border rounded mb-3">

      <h3 th:text="${p.title}"></h3>
      <small th:text="${#dates.format(p.createdAt,'yyyy-MM-dd HH:mm')}"></small>

      <p th:text="${p.content != null && p.content.length() > 150
            ? p.content.substring(0,150) + '...'
            : p.content}"></p>

      <div class="mt-2">
        <a class="btn btn-warning" th:href="@{|/admin/posts/edit/${p.id}|}">Edit</a>

        <form th:action="@{|/admin/posts/${p.id}/delete|}"
              method="post" style="display:inline">
          <button class="btn btn-danger" type="submit">Delete</button>
        </form>
      </div>

    </div>
  </div>

</div>

</body>
</html>
