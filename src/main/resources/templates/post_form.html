<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="fragments/header :: content">
<div>
  <h2 th:text="${post.id == null ? 'Create post' : 'Edit post'}"></h2>
  <form th:action="@{${post.id == null ? '/admin/posts' : '/admin/posts'}}" method="post" th:object="${post}">
    <input type="hidden" th:if="${post.id != null}" th:field="*{id}" />
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input th:field="*{title}" class="form-control"/>
    </div>
    <div class="mb-3">
      <label class="form-label">Content</label>
      <textarea th:field="*{content}" class="form-control" rows="8"></textarea>
    </div>
    <button class="btn btn-primary" type="submit">Save</button>
  </form>
</div>
</html>
