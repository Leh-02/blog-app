<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="admin/admin_layout :: head"></head>
<body th:replace="admin/admin_layout :: layout(~{::content})">

<div th:fragment="content">

  <h2>Users</h2>

  <table class="table table-striped mt-3">
    <thead>
    <tr>
      <th>ID</th>
      <th>Full Name</th>
      <th>Email</th>
      <th>Role</th>
      <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="u : ${users}">
      <td th:text="${u.id}"></td>
      <td th:text="${u.fullName}"></td>
      <td th:text="${u.email}"></td>
      <td th:text="${u.role}"></td>
      <td>
        <form th:action="@{|/admin/users/${u.id}/delete|}" method="post">
          <button class="btn btn-danger btn-sm">Delete</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

</div>

</body>
</html>
