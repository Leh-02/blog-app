<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="fragments/header :: content">
<div>
  <h2 th:text="${post.title}">Title</h2>
  <p><small th:text="${#dates.format(post.createdAt,'yyyy-MM-dd HH:mm')}"></small></p>
  <p th:text="${post.content}">Content</p>
  <p>By <b th:text="${post.author != null ? post.author.username : 'anon'}"></b></p>
  <div class="mb-3">
    <form th:action="@{|/posts/${post.id}/like|}" method="post" style="display:inline">
      <button class="btn btn-sm btn-outline-danger" type="submit">❤ <span th:text="${#lists.size(post.likedBy)}"></span></button>
    </form>
    <form th:action="@{|/posts/${post.id}/save|}" method="post" style="display:inline">
      <button class="btn btn-sm btn-outline-success" type="submit">Save</button>
    </form>
  </div>

  <h4>Comments</h4>
  <div th:if="${#lists.isEmpty(post.comments)}"><em>No comments yet</em></div>
  <div th:each="c : ${post.comments}" class="card mb-2">
    <div class="card-body">
      <h6 class="card-subtitle mb-2 text-muted"><b th:text="${c.author != null ? c.author.username : 'anon'}"></b>
        <small class="text-muted" th:text="${#dates.format(c.createdAt,'yyyy-MM-dd HH:mm')}"></small></h6>
      <p class="card-text" th:text="${c.content}"></p>
    </div>
  </div>

  <div class="mt-4" th:if="${#authentication.name != 'anonymousUser'}">
    <h5>Add comment</h5>
    <form th:action="@{|/posts/${post.id}/comment|}" method="post" th:object="${comment}">
      <div class="mb-3">
        <textarea th:field="*{content}" class="form-control" rows="3"></textarea>
      </div>
      <button class="btn btn-primary" type="submit">Send</button>
    </form>
  </div>

  <p class="mt-3"><a th:href="@{/posts}">Back to posts</a></p>
</div>
</html>
