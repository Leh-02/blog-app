<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="UTF-8">
    <title>Reader Panel</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/reader.css}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand" th:href="@{/reader/home}">Reader Panel</a>

    <ul class="navbar-nav ms-auto">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/reader/saved}">Saved</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-danger" th:href="@{/logout}">Logout</a>
        </li>
    </ul>
</nav>

<div class="container mt-4" th:fragment="layout(content)">
    <div th:replace="${content}"></div>
</div>

</body>
</html>
