<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="reader/reader_layout :: head"></head>

<body th:replace="reader/reader_layout :: layout(~{::content})">

<div th:fragment="content">

  <h2 th:text="${post.title}"></h2>

  <p class="text-muted"
     th:text="${#temporals.format(post.createdAt,'yyyy-MM-dd HH:mm')}"></p>

  <p class="mt-3" th:text="${post.content}"></p>

  <div class="mt-4">

    <form th:action="@{|/posts/${post.id}/like|}" method="post" class="d-inline">
      <button class="btn btn-outline-danger btn-sm">
        ❤️ Like (<span th:text="${post.likedBy.size()}"></span>)
      </button>
    </form>

    <form th:action="@{|/posts/${post.id}/save|}" method="post" class="d-inline">
      <button class="btn btn-outline-primary btn-sm">⭐ Save</button>
    </form>

  </div>

  <hr>

  <h4>Comments</h4>

  <div class="border rounded p-3 mb-2 bg-light"
       th:each="c : ${post.comments}">
    <b th:text="${c.author.fullName}"></b>
    <span class="text-muted small"
          th:text="${#temporals.format(c.createdAt,'yyyy-MM-dd HH:mm')}"></span>
    <p class="mt-2" th:text="${c.content}"></p>
  </div>

  <hr>

  <form th:action="@{|/posts/${post.id}/comment|}" method="post">
        <textarea class="form-control" name="content" required
                  placeholder="Write a comment..."></textarea>
    <button class="btn btn-success mt-2">Submit</button>
  </form>

</div>

</body>
</html>
